  <path d="M6 54V16C6 10.477 10.477 6 16 6H54" stroke="#D4AF37" stroke-width="0.5" stroke-dasharray="1.5 2" stroke-linecap="round"/>

  <!-- Corner Finial Node (Top-Left) -->
  <circle cx="2" cy="2" r="1.5" fill="#C59B27"/>
