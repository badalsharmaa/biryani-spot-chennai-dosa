    <circle cx="0" cy="0" r="2.2" fill="#C59B27"/>
    <circle cx="0" cy="0" r="1" fill="#FFF8E7"/>
  </g>

  <!-- Flowing Chettinad Manga (Paisley) & Cardamom Curves -->
