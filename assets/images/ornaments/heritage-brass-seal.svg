<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B3"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6D23"/>
    </linearGradient>
  </defs>

  <!-- Outer Beaded Athangudi Ring -->
  <circle cx="80" cy="80" r="76" stroke="url(#sealGold)" stroke-width="1.5"/>
  <circle cx="80" cy="80" r="72" stroke="#C59B27" stroke-width="0.6" stroke-dasharray="2 3"/>

  <!-- 24 Radial Ray Serrations -->
  <g transform="translate(80, 80)">
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(0)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(15)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(30)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(45)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(60)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(75)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(90)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(105)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(120)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(135)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(150)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(165)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(180)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(195)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(210)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(225)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(240)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(255)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(270)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(285)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(300)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(315)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(330)" />
    <line x1="0" y1="-72" x2="0" y2="-66" stroke="#D4AF37" stroke-width="1" transform="rotate(345)" />
  </g>

  <!-- Middle Concentric Gold Ring -->
  <circle cx="80" cy="80" r="62" stroke="url(#sealGold)" stroke-width="1.8"/>
  <circle cx="80" cy="80" r="58" stroke="#8C6D23" stroke-width="0.5"/>

  <!-- Center Core: Handi + Dosa Silhouette with Star Anise -->
  <g transform="translate(80, 80)">
    <!-- Star Anise Background Radiance -->
    <path d="M0 -36 C3 -18, 12 -12, 28 0 C12 12, 3 18, 0 36 C-3 18, -12 12, -28 0 C-12 -12, -3 -18, 0 -36Z" fill="#D4AF37" fill-opacity="0.25"/>
    <path d="M-22 -22 C-11 -11, -6 -6, 0 0 C6 -6, 11 -11, 22 -22 C11 -11, 6 -6, 0 0 C-6 6, -11 11, -22 22 C-11 11, -6 6, 0 0 C6 -6, 11 -11, 22 22" stroke="#C59B27" stroke-width="0.6" fill="none"/>

    <!-- Central Clay Handi & Dosa Cone -->
    <path d="M-18 -10 C-26 -2, -28 14, -18 22 C-10 28, 10 28, 18 22 C28 14, 26 -2, 18 -10 Z" fill="url(#sealGold)" stroke="#FFF8E7" stroke-width="1"/>
    <ellipse cx="0" cy="-12" rx="18" ry="4" fill="#8C6D23" stroke="#FFF8E7" stroke-width="0.8"/>
    <path d="M0 -12 L0 -24" stroke="#FFF8E7" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="0" cy="-26" r="2.5" fill="#FFF8E7"/>

    <!-- Dosa Cone Overlay -->
    <path d="M-8 12 L0 -6 L8 12 Q0 16, -8 12Z" fill="#FFF5CC" stroke="#8C6D23" stroke-width="0.6"/>
  </g>
</svg>